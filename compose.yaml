services:
  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-leetcode_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-leetcode}
      MYSQL_USER: ${MYSQL_USER:-leetcode}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-leetcode_dev}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-leetcode_root_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2.1
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-leetcode}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-leetcode_dev}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_HOST_PORT:-8080}:80"

  cli:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-leetcode}
      MYSQL_USER: ${MYSQL_USER:-leetcode}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-leetcode_dev}
      LEETCODE_PRACTICE_DATABASE: ${MYSQL_DATABASE:-leetcode}
      DATASETS_DIR: /datasets
    volumes:
      - ./datasets:/datasets:ro
      - ./scripts/leetcode:/usr/local/bin/leetcode:ro
      - ./scripts/lib:/usr/local/lib/leetcode/lib:ro
      - ./tests:/tests:ro

volumes:
  mysql_data:
